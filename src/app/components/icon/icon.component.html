<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  [attr.stroke]="color || 'currentColor'"
  stroke-width="2.2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
  class="app-icon"
>
  <ng-container [ngSwitch]="name">
    <path *ngSwitchCase="'plus'" d="M12 5v14M5 12h14" />

    <g *ngSwitchCase="'info'">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 10v6" />
      <circle cx="12" cy="7.2" r="1.2" class="dot" />
    </g>

    <g *ngSwitchCase="'box'">
      <rect x="3" y="6" width="18" height="14" rx="2" />
      <path d="M3 10h18" />
      <rect x="14" y="12" width="5" height="3" rx="1" />
    </g>

    <g *ngSwitchCase="'cart'">
      <path d="M3 5h2l.4 2M7 13h9l3-7H5.4" />
      <circle cx="7" cy="17" r="1.5" />
      <circle cx="16" cy="17" r="1.5" />
    </g>

    <g *ngSwitchCase="'chart'">
      <path d="M3 20h18" />
      <path d="M7 20V10" />
      <path d="M12 20V6" />
      <path d="M17 20v-8" />
    </g>

    <g *ngSwitchCase="'bar-chart'">
      <path d="M3 20h18" />
      <rect x="6" y="10" width="3" height="10" rx="1.2" />
      <rect x="11" y="6" width="3" height="14" rx="1.2" />
      <rect x="16" y="12" width="3" height="8" rx="1.2" />
    </g>

    <g *ngSwitchCase="'grid'">
      <rect x="4" y="4" width="7" height="7" rx="1.5" />
      <rect x="13" y="4" width="7" height="7" rx="1.5" />
      <rect x="4" y="13" width="7" height="7" rx="1.5" />
      <rect x="13" y="13" width="7" height="7" rx="1.5" />
    </g>

    <g *ngSwitchCase="'users'">
      <path d="M16.5 21v-1a4.5 4.5 0 0 0-9 0v1" />
      <circle cx="12" cy="9" r="3" />
      <path d="M22 21v-1c0-2-2-3.5-4-3.5" />
      <path d="M6 16.5C4 16.5 2 18 2 20v1" />
      <path d="M19 10a2.5 2.5 0 1 0 0-5" />
      <path d="M5 10a2.5 2.5 0 1 1 0-5" />
    </g>

    <g *ngSwitchCase="'archive'">
      <rect x="3" y="4" width="18" height="4" rx="1" />
      <rect x="5" y="8" width="14" height="12" rx="2" />
      <path d="M10 12h4" />
    </g>

    <g *ngSwitchCase="'package'">
      <path d="M12 2l9 4.5-9 4.5-9-4.5 9-4.5z" />
      <path d="M21 6.5V17l-9 4.5V11z" />
      <path d="M3 6.5V17l9 4.5V11z" />
      <path d="M12 2v9" />
    </g>

    <g *ngSwitchCase="'menu'">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </g>

    <g *ngSwitchCase="'search'">
      <circle cx="11" cy="11" r="7" />
      <path d="M21 21l-4.3-4.3" />
    </g>

    <g *ngSwitchCase="'calendar'">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M16 3v4M8 3v4M3 9h18" />
      <rect x="7" y="13" width="4" height="3" rx="0.8" />
      <rect x="13" y="13" width="4" height="3" rx="0.8" />
    </g>

    <g *ngSwitchCase="'pie-chart'">
      <path d="M11 3a9 9 0 1 0 9 9h-9z" />
      <path d="M12 12V3a9 9 0 0 1 9 9z" />
    </g>

    <g *ngSwitchCase="'alert-triangle'">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </g>

    <g *ngSwitchCase="'dollar-sign'">
      <path d="M12 1v22" />
      <path d="M17 5H9a3 3 0 0 0 0 6h6a3 3 0 1 1 0 6H6" />
    </g>

    <g *ngSwitchCase="'credit-card'">
      <rect x="2" y="5" width="20" height="14" rx="2" />
      <path d="M2 10h20" />
    </g>

    <g *ngSwitchCase="'shopping-cart'">
      <path d="M6 6h15l-1.5 9h-12z" />
      <circle cx="9" cy="20" r="1.5" />
      <circle cx="18" cy="20" r="1.5" />
    </g>

    <g *ngSwitchCase="'edit'">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
    </g>

    <g *ngSwitchCase="'trash'">
      <rect x="3" y="6" width="18" height="14" rx="2" />
      <path d="M8 6V4h8v2M4 6h16" />
      <path d="M10 11v6M14 11v6" />
    </g>

    <g *ngSwitchCase="'user'">
      <circle cx="12" cy="8" r="4" />
      <path d="M6 20v-1a6 6 0 0 1 12 0v1" />
    </g>

    <g *ngSwitchCase="'download'">
      <path d="M12 3v12" />
      <path d="M7 10l5 5 5-5" />
      <path d="M5 21h14" />
    </g>

    <g *ngSwitchCase="'x'">
      <path d="M6 6l12 12M18 6l-12 12" />
    </g>

    <circle *ngSwitchDefault cx="12" cy="12" r="2" />
  </ng-container>
</svg>
