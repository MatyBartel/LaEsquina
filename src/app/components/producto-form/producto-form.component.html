<div class="form-container">
  <h1>{{ editId ? '✏️ Editar producto' : '➕ Agregar producto' }}</h1>

  <form (ngSubmit)="guardar()" #form="ngForm">
    <div class="form-grid">
      <div class="form-group">
        <label for="codigo">Código*</label>
        <input id="codigo" name="codigo" [(ngModel)]="codigo" [readonly]="!!editId" required />
      </div>

      <div class="form-group">
        <label for="nombre">Nombre*</label>
        <input id="nombre" name="nombre" [(ngModel)]="nombre" required />
      </div>

      <div class="form-group">
        <label for="categoria">Categoría*</label>
        <div class="cat-combo">
          <div class="combo-header" (click)="toggleDropdownCategorias()">
            <span>{{ categoria || 'Selecciona una categoría' }}</span>
            <button type="button" class="btn-icon" (click)="toggleNuevaCategoria(); $event.stopPropagation()">+</button>
          </div>
          <div class="combo-menu" *ngIf="categoriaDropdownAbierto">
            <div class="combo-item" *ngFor="let c of categorias" (click)="seleccionarCategoria(c)">
              <span>{{ c }}</span>
              <button type="button" class="chip-x" (click)="eliminarCategoria(c); $event.stopPropagation()">×</button>
            </div>
            <div class="empty" *ngIf="!categorias?.length">No hay categorías aún</div>
          </div>
          <div class="new-cat" *ngIf="mostrarNuevaCategoria">
            <input id="inputNuevaCategoria" placeholder="Nueva categoría" [(ngModel)]="nuevaCategoriaNombre" name="nuevaCategoria" />
            <button type="button" class="btn-secondary" (click)="agregarCategoria()">Agregar</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="precio">Precio de venta*</label>
        <input id="precio" name="precio" type="number" step="0.01" min="0" [(ngModel)]="precio" required />
      </div>

      <div class="form-group">
        <label for="stock">Stock</label>
        <input id="stock" name="stock" type="number" min="0" [(ngModel)]="stock" />
      </div>

      <div class="form-group">
        <label for="stockMinimo">Stock mínimo</label>
        <input id="stockMinimo" name="stockMinimo" type="number" min="0" [(ngModel)]="stockMinimo" />
      </div>

      <div class="form-group">
        <label for="proveedor">Proveedor</label>
        <input id="proveedor" name="proveedor" [(ngModel)]="proveedor" />
      </div>

      <div class="form-group full">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" [(ngModel)]="descripcion"></textarea>
      </div>
    </div>

    <div class="caracteristicas">
      <div class="header">
        <h3>Características adicionales</h3>
        <button type="button" class="btn-secondary" (click)="agregarCaracteristica()">Añadir característica</button>
      </div>
      <div class="list" *ngIf="caracteristicas.length; else vacio">
        <div class="item" *ngFor="let c of caracteristicas; index as i">
          <input placeholder="Clave (ej: material)" [(ngModel)]="c.clave" name="cClave{{i}}" />
          <input placeholder="Valor (ej: acero)" [(ngModel)]="c.valor" name="cValor{{i}}" />
          <button type="button" class="btn-danger" (click)="eliminarCaracteristica(i)">Eliminar</button>
        </div>
      </div>
      <ng-template #vacio>
        <p class="muted">No hay características cargadas.</p>
      </ng-template>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary">{{ editId ? 'Actualizar' : 'Guardar' }}</button>
      <button type="button" class="btn-light" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
